name: Reproduce figures and statistics

on:
  workflow_dispatch:
  pull_request:
  release:
    types: [published]
  push:
    branches:
      - main
      - 'codex/portable-source-reproduction'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  reproduce:
    name: Python 3.10 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check browser and source integrity
        run: |
          python -c "import runpy; print(runpy.run_path('reproduction/runtime/ca_analysis/browser_export.py')['find_browser']())"
          python reproduce.py --check-only
          python -m unittest discover -s tests -v
      - name: Check browser PDF export
        if: runner.os != 'macOS'
        run: python tests/browser_smoke.py
      - name: Diagnose native macOS shutdown
        if: runner.os == 'macOS'
        run: python tests/macos_browser_diagnostic.py
      - name: Recompute all statistical groups without a browser
        if: always()
        run: python reproduce.py --statistics-only --output-dir outputs/statistics-only
      - name: Reproduce all figures, tables and statistical tests
        if: runner.os != 'macOS'
        run: python reproduce.py --output-dir outputs/reproduction
      - name: Save run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-reports-${{ matrix.os }}
          retention-days: 7
          path: |
            outputs/reproduction/BUILD_SOURCE_AUTHORITY.json
            outputs/reproduction/REPRODUCTION_REPORT.json
            outputs/reproduction/*/BUILD.log
            outputs/reproduction/statistics/STATISTICS_REPORT.json
            outputs/statistics-only/BUILD_SOURCE_AUTHORITY.json
            outputs/statistics-only/statistics/STATISTICS_REPORT.json
            outputs/reproduction/main_figure_1/figure1_version_record_600dpi.png
            outputs/reproduction/extended_data_figure_2/composite/ed02_version_record_600dpi.png
            outputs/reproduction/extended_data_figure_8/ed8_standardized_pv_300dpi.png
